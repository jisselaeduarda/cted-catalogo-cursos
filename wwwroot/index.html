
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Explore cursos de qualificação profissional para a indústria."
    >

    <title>CTED | Catálogo de Cursos</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header>
        <img
            src="/images/logo-sesi-industria-primary.svg"
            alt="SESI Indústria"
            class="logo-sesi"
        >

        <h1>Impulsione sua carreira na indústria</h1>

        <p>
            Encontre cursos para desenvolver suas habilidades profissionais.
        </p>
    </header>

    <main>
        <section aria-labelledby="titulo-catalogo">
            <h2 id="titulo-catalogo">Explore nossos cursos</h2>

            <div class="filtros">
                <div>
                    <label for="busca">Buscar curso:</label>

                    <input
                        type="search"
                        id="busca"
                        placeholder="Digite o nome do curso"
                    >
                </div>

                <div>
                    <label for="categoria">Categoria:</label>

                    <select id="categoria">
                        <option value="">Todas</option>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Segurança">Segurança</option>
                        <option value="Gestão">Gestão</option>
                    </select>
                </div>

                <div>
                    <label for="modalidade">Modalidade:</label>

                    <select id="modalidade">
                        <option value="">Todas</option>
                        <option value="Online">Online</option>
                        <option value="Presencial">Presencial</option>
                    </select>
                </div>

                <div>
                    <label for="status">Status:</label>

                    <select id="status">
                        <option value="">Todos</option>
                        <option value="Disponível">Disponível</option>
                        <option value="Em breve">Em breve</option>
                        <option value="Encerrado">Encerrado</option>
                    </select>
                </div>
            </div>

            <button type="button" id="limpar-filtros">
                Limpar filtros
            </button>

            <p id="total-resultados" aria-live="polite">
                Carregando cursos...
            </p>

            <div class="controles-carrossel" id="controles-carrossel">
                <button
                    type="button"
                    id="curso-anterior"
                    aria-label="Cursos anteriores"
                >
                    &#10094;
                </button>

                <button
                    type="button"
                    id="curso-proximo"
                    aria-label="Próximos cursos"
                >
                    &#10095;
                </button>
            </div>

            <div id="lista-cursos" aria-live="polite">
                <p>Os cursos serão exibidos aqui.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>CTED — Catálogo de Cursos</p>
    </footer>

    <script>
        const listaCursos = document.getElementById("lista-cursos");
        const totalResultados = document.getElementById("total-resultados");
        const controlesCarrossel =
            document.getElementById("controles-carrossel");

        /*
         * Imagens disponíveis no material oficial do SESI.
         * São imagens gerais da plataforma, não fotos individuais dos cursos.
         */
        const imagensPorCategoria = {
            Tecnologia: "/images/hero-image.png",
            Segurança: "/images/banner-ava.png",
            Gestão: "/images/video-thumb.png"
        };

        async function carregarCursos() {
            controlesCarrossel.hidden = false;
            totalResultados.textContent = "Carregando cursos...";
            listaCursos.innerHTML = "";

            try {
                const parametros = new URLSearchParams({
                    busca: document.getElementById("busca").value.trim(),
                    categoria: document.getElementById("categoria").value,
                    modalidade: document.getElementById("modalidade").value,
                    status: document.getElementById("status").value
                });

                const resposta = await fetch(
                    `/api/cursos?${parametros.toString()}`
                );

                if (!resposta.ok) {
                    throw new Error(
                        `Erro ao consultar a API: ${resposta.status}`
                    );
                }

                const cursos = await resposta.json();

                totalResultados.textContent =
                    `${cursos.length} ${
                        cursos.length === 1
                            ? "curso encontrado"
                            : "cursos encontrados"
                    }`;

                if (cursos.length === 0) {
                    listaCursos.textContent =
                        "Nenhum curso encontrado. Tente alterar os filtros.";

                    controlesCarrossel.hidden = true;
                    return;
                }

                cursos.forEach(curso => {
                    const cartao = document.createElement("article");
                    const categoria = document.createElement("p");
                    const titulo = document.createElement("h3");
                    const descricao = document.createElement("p");
                    const informacoes = document.createElement("p");
                    const status = document.createElement("p");

                    cartao.classList.add("cartao-curso");
                    cartao.setAttribute("role", "button");
                    cartao.setAttribute("tabindex", "0");

                    cartao.setAttribute(
                        "aria-label",
                        `Ver detalhes do curso ${curso.nomeResumido}`
                    );

                    const caminhoImagem =
                        imagensPorCategoria[curso.categoria];

                    if (caminhoImagem) {
                        const imagem = document.createElement("img");

                        imagem.src = caminhoImagem;
                        imagem.alt =
                            `Imagem ilustrativa do curso ${curso.nomeResumido}`;
                        imagem.classList.add("imagem-curso");
                        imagem.loading = "lazy";

                        imagem.addEventListener("error", () => {
                            imagem.remove();
                        });

                        cartao.appendChild(imagem);
                    }

                    categoria.textContent = curso.categoria;
                    titulo.textContent = curso.nomeResumido;
                    descricao.textContent = curso.descricao;

                    informacoes.textContent =
                        `${curso.modalidade} | ${curso.cargaHoraria} horas`;

                    status.textContent = curso.status;

                    cartao.append(
                        categoria,
                        titulo,
                        descricao,
                        informacoes,
                        status
                    );

                    cartao.addEventListener("click", () => {
                        mostrarDetalhes(curso);
                    });

                    cartao.addEventListener("keydown", evento => {
                        if (
                            evento.key === "Enter" ||
                            evento.key === " "
                        ) {
                            evento.preventDefault();
                            mostrarDetalhes(curso);
                        }
                    });

                    listaCursos.appendChild(cartao);
                });
            } catch (erro) {
                console.error("Erro ao carregar cursos:", erro);

                totalResultados.textContent =
                    "Não foi possível carregar os cursos.";

                listaCursos.textContent =
                    "Verifique se a aplicação está em execução e tente novamente.";

                controlesCarrossel.hidden = true;
            }
        }

        function mostrarDetalhes(curso) {
            listaCursos.innerHTML = "";
            controlesCarrossel.hidden = true;

            const painel = document.createElement("article");
            painel.classList.add("detalhes-curso");

            const titulo = document.createElement("h2");
            const nome = document.createElement("h3");
            const descricao = document.createElement("p");
            const categoria = document.createElement("p");
            const modalidade = document.createElement("p");
            const cargaHoraria = document.createElement("p");
            const publicoAlvo = document.createElement("p");
            const status = document.createElement("p");
            const voltar = document.createElement("button");

            titulo.textContent = "Detalhes do curso";
            titulo.tabIndex = -1;

            nome.textContent = curso.nomeCompleto;
            descricao.textContent = curso.descricao;
            categoria.textContent = `Categoria: ${curso.categoria}`;
            modalidade.textContent = `Modalidade: ${curso.modalidade}`;

            cargaHoraria.textContent =
                `Carga horária: ${curso.cargaHoraria} horas`;

            publicoAlvo.textContent =
                `Público-alvo: ${curso.publicoAlvo}`;

            status.textContent = `Status: ${curso.status}`;

            const caminhoImagem =
                imagensPorCategoria[curso.categoria];

            if (caminhoImagem) {
                const imagem = document.createElement("img");

                imagem.src = caminhoImagem;
                imagem.alt =
                    `Imagem ilustrativa de ${curso.nomeResumido}`;
                imagem.classList.add("imagem-detalhes");

                imagem.addEventListener("error", () => {
                    imagem.remove();
                });

                painel.appendChild(imagem);
            }

            painel.append(
                titulo,
                nome,
                descricao,
                categoria,
                modalidade,
                cargaHoraria,
                publicoAlvo,
                status
            );

            voltar.type = "button";
            voltar.textContent = "Voltar aos cursos";

            voltar.addEventListener("click", carregarCursos);

            painel.appendChild(voltar);
            listaCursos.appendChild(painel);

            titulo.focus();
        }

        document
            .getElementById("busca")
            .addEventListener("input", carregarCursos);

        document
            .getElementById("categoria")
            .addEventListener("change", carregarCursos);

        document
            .getElementById("modalidade")
            .addEventListener("change", carregarCursos);

        document
            .getElementById("status")
            .addEventListener("change", carregarCursos);

        document
            .getElementById("limpar-filtros")
            .addEventListener("click", () => {
                document.getElementById("busca").value = "";
                document.getElementById("categoria").value = "";
                document.getElementById("modalidade").value = "";
                document.getElementById("status").value = "";

                carregarCursos();
            });

        document
            .getElementById("curso-anterior")
            .addEventListener("click", () => {
                listaCursos.scrollBy({
                    left: -listaCursos.clientWidth,
                    behavior: "smooth"
                });
            });

        document
            .getElementById("curso-proximo")
            .addEventListener("click", () => {
                listaCursos.scrollBy({
                    left: listaCursos.clientWidth,
                    behavior: "smooth"
                });
            });

        carregarCursos();
    </script>
</body>
</html>
